<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play</title>
</head>
<body style="font-family: system-ui, sans-serif; padding: 24px;">
  <h1>📱 Play</h1>

  <div style="margin: 12px 0; padding: 12px; border: 1px solid #ddd; border-radius: 10px;">
    <div><strong>حالة الاتصال:</strong> <span id="conn">جاري الاتصال…</span></div>
    <div style="margin-top: 8px;"><strong>الحالة:</strong> <span id="status">—</span></div>
  </div>

  <label>كود الغرفة</label><br/>
  <input id="room" placeholder="مثال: ABCD" style="padding:10px; width: 220px; border-radius: 10px; border:1px solid #ccc;" />
  <br/><br/>

  <label>اسمك</label><br/>
  <input id="name" placeholder="اسم اللاعب" style="padding:10px; width: 220px; border-radius: 10px; border:1px solid #ccc;" />
  <br/><br/>

  <button id="join" disabled style="padding: 10px 14px; border-radius: 10px;">
    دخول
  </button>

  <p style="margin-top: 20px;"><a href="/">رجوع</a></p>

  <script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script>
  <script>
    const SERVER_URL = "https://api.gamehub4u.com";

    const connEl = document.getElementById("conn");
    const statusEl = document.getElementById("status");
    const roomEl = document.getElementById("room");
    const nameEl = document.getElementById("name");
    const joinBtn = document.getElementById("join");

    let cid = localStorage.getItem('gh_clientId') || localStorage.getItem('clientId');
    if (!cid) { cid = crypto?.randomUUID?.() || ('cid_' + Math.random().toString(36).slice(2)); localStorage.setItem('gh_clientId', cid); localStorage.setItem('clientId', cid); }

    const socket = io(SERVER_URL, {
      transports: ["websocket", "polling"],
      auth: { clientId: cid, gh_clientId: cid }
    });

    function setConn(text) { connEl.textContent = text; }
    function setStatus(text) { statusEl.textContent = text; }

    socket.on("connect", () => {
      setConn("متصل ✅");
      joinBtn.disabled = false;
      setStatus("اكتب كود الغرفة واسمك");
    });

    socket.on("disconnect", () => {
      setConn("غير متصل ❌");
      joinBtn.disabled = true;
      setStatus("انقطع الاتصال");
    });

    socket.on("connect_error", (err) => {
      setConn("فشل الاتصال ❌");
      joinBtn.disabled = true;
      alert("فشل الاتصال بالسيرفر: " + (err?.message || err));
      console.log("connect_error:", err);
    });

    joinBtn.onclick = () => {
      const roomCode = (roomEl.value || "").trim().toUpperCase();
      const name = (nameEl.value || "").trim();

      if (!roomCode || !name) {
        alert("اكتب كود الغرفة واسمك");
        return;
      }

      if (!socket.connected) {
        alert("السيرفر غير متصل. حاول مرة ثانية.");
        return;
      }

      setStatus("جاري محاولة الدخول…");
      socket.emit("player:join", { roomCode, name, clientId: cid });
    };

    // لو دخلت كود غلط السيرفر بيرسل join:error
    socket.on("join:error", ({ message } = {}) => {
      setStatus("فشل الدخول");
      alert(message || "الغرفة غير موجودة");
    });

    // لما الدخول ينجح، روّح للوبي
    socket.on("player:joined", ({ roomCode: rc } = {}) => {
      const code = (rc || roomEl.value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8);
      location.href = "/lobby.html?room=" + encodeURIComponent(code);
    });
  </script>
</body>
</html>
