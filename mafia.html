<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مافيا | Game Hub 4U</title>
<style>
:root{--bg:#070812;--card:rgba(255,255,255,.065);--line:rgba(255,255,255,.12);--text:#fff7ed;--muted:rgba(255,237,213,.66);--orange:#f97316;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--shadow:0 24px 70px rgba(0,0,0,.45);--r:28px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 700px at 80% -10%,rgba(249,115,22,.18),transparent 60%),radial-gradient(900px 700px at 0% 30%,rgba(127,29,29,.20),transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:18px}.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:var(--r)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;margin-bottom:16px}.brand{display:flex;gap:12px;align-items:center}.logo{width:58px;height:58px;border-radius:999px;display:grid;place-items:center;background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.35);font-size:28px}.title{font-size:24px;font-weight:1000}.sub,.small{font-size:12px;color:var(--muted);line-height:1.55}.phase{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;font-weight:900;color:var(--muted)}.pill strong{color:#fff}.status{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 18px rgba(239,68,68,.4)}.status.ok{background:var(--green);box-shadow:0 0 20px rgba(34,197,94,.5)}.btn{border:0;border-radius:999px;padding:11px 15px;font-weight:1000;cursor:pointer;color:#fff;background:#ea580c;box-shadow:0 14px 30px rgba(234,88,12,.23);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}.btn.secondary{background:rgba(255,255,255,.075);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.48;cursor:not-allowed}.main{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}.panel{padding:16px}.sectionTitle{font-size:16px;font-weight:1000;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.players,.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}.player,.target,.logItem{padding:12px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid var(--line)}.player.dead{opacity:.45;filter:grayscale(.6)}.pname{font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:11px;margin-top:8px;display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);font-weight:900}.role.mafia{color:#fecaca;background:rgba(239,68,68,.12)}.role.doctor{color:#bbf7d0;background:rgba(34,197,94,.11)}.role.detective{color:#bfdbfe;background:rgba(59,130,246,.11)}.target{cursor:pointer;color:#fff;text-align:right}.target:hover{border-color:rgba(249,115,22,.65);background:rgba(249,115,22,.1)}.narrator{padding:12px 14px;border-radius:18px;border:1px solid rgba(249,115,22,.25);background:rgba(249,115,22,.09);color:#fed7aa;margin-bottom:12px;font-weight:800}.log{min-height:220px;display:flex;flex-direction:column;gap:8px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toast{position:fixed;left:16px;bottom:16px;z-index:1000;display:none;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-weight:900}@media(max-width:900px){.main{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.phase{width:100%}.pill{flex:1;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
<header class="top glass"><div class="brand"><div id="phaseIcon" class="logo">☠️</div><div><div id="phaseTitle" class="title">جاري التحميل...</div><div class="sub">غرفة: <b id="roomLabel">----</b> · دورك: <b id="roleLabel">غير محدد</b></div></div></div><div class="phase"><span id="conn" class="status"></span><span class="pill">Socket</span><span class="pill">الجولة: <strong id="round">—</strong></span><span class="pill">اللاعبون: <strong id="playerCount">0</strong></span><button id="nextBtn" class="btn secondary">التالي</button><button id="backLobby" class="btn secondary">اللوبي</button></div></header>
<div class="main"><section class="panel glass"><div id="narrator" class="narrator">مرحباً بك في مدينة المافيا...</div><div class="sectionTitle"><span>اللاعبون</span><div class="row"><button id="startBtn" class="btn">ابدأ اللعبة</button></div></div><div id="players" class="players"></div><div style="height:16px"></div><div class="sectionTitle"><span id="actionTitle">الإجراء</span><span id="actionHint" class="small"></span></div><div id="actions" class="actions"></div></section><aside class="panel glass"><div class="sectionTitle"><span>الأحداث</span></div><div id="logs" class="log"></div></aside></div>
</div><div id="toast" class="toast"></div>
<script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script>
<script>
const SERVER_URL='https://api.gamehub4u.com';const qs=new URLSearchParams(location.search);const roomCode=(qs.get('room')||'').toUpperCase();let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}const $=id=>document.getElementById(id);let state=null,roomState=null,myRole=null,lastError='';$('roomLabel').textContent=roomCode||'----';$('backLobby').href='/lobby.html?room='+encodeURIComponent(roomCode);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',1800)}function roleName(r){return ({mafia:'مافيا',doctor:'طبيب',detective:'محقق',villager:'مواطن'})[r]||'غير محدد'}function phaseName(p){return ({role:'كشف الأدوار',night:'وقت الليل',day:'وقت النهار'})[p]||'في انتظار البداية'}function phaseIcon(p){return p==='night'?'🌙':p==='day'?'☀️':p==='role'?'🎭':'☠️'}
const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid,gh_clientId:cid}});socket.on('connect',()=>{$('conn').classList.add('ok');socket.emit('player:attach',{roomCode,clientId:cid});socket.emit('room:getState',{roomCode,clientId:cid});socket.emit('mafia:getState',{roomCode,clientId:cid});});socket.on('disconnect',()=>{$('conn').classList.remove('ok')});socket.on('room:state',s=>{roomState=s;render()});socket.on('room:update',s=>{roomState=s;render()});socket.on('mafia:state',s=>{state=s;myRole=s.myRole||myRole;render()});socket.on('mafia:role',r=>{myRole=r.role;render()});socket.on('game:error',({message}={})=>{lastError=message||'Error';toast(lastError);render()});socket.on('lobby:reset',()=>location.href='/lobby.html?room='+roomCode);
setTimeout(()=>{if(!state&&!roomState){lastError='ما وصل رد من السيرفر. تأكد أنك رفعت مجلد gamehub-server الجديد على Render وعملت Manual Deploy.';render()}},3500);
function players(){if(state?.alive?.length)return state.alive.map(p=>({clientId:p.clientId,name:p.name,alive:p.alive}));return (roomState?.players||[]).map(p=>({clientId:p.clientId,name:p.name,alive:true,isHost:p.isHost}))}function isHost(){return roomState?.hostClientId===cid || roomState?.players?.some(p=>p.clientId===cid&&p.isHost) || state?.canAdvance}function aliveTargets(includeSelf=true){return players().filter(p=>p.alive&&(includeSelf||p.clientId!==cid))}
function render(){const ps=players();$('playerCount').textContent=ps.length;$('round').textContent=state?.round||'—';$('roleLabel').textContent=roleName(myRole||state?.myRole);$('phaseTitle').textContent=state?.started?phaseName(state.phase):(lastError?'مشكلة اتصال':'في انتظار اللاعبين');$('phaseIcon').textContent=phaseIcon(state?.phase);$('startBtn').style.display=(!state?.started&&isHost())?'inline-flex':'none';$('startBtn').disabled=ps.length<2&&!roomState?.devMode;$('nextBtn').style.display=(state?.started&&isHost()&&!state?.winnerTeam)?'inline-flex':'none';$('players').innerHTML=ps.length?ps.map(p=>`<div class="player ${!p.alive?'dead':''}"><div class="pname">${esc(p.name)} ${p.clientId===cid?'· أنت':''} ${p.isHost?'👑':''}</div><div class="small">${p.alive?'حي':'ميت 💀'}</div>${p.clientId===cid||state?.winnerTeam?`<span class="role ${esc(myRole||'')}">${p.clientId===cid?roleName(myRole||state?.myRole):''}</span>`:''}</div>`).join(''):'<div class="small">لا يوجد لاعبين ظاهرين بعد.</div>';renderActions();renderLogs();}
function renderActions(){const box=$('actions'),title=$('actionTitle'),hint=$('actionHint');box.innerHTML='';hint.textContent='';if(lastError&&!state&&!roomState){title.textContent='مشكلة';box.innerHTML='<div class="logItem">'+esc(lastError)+'</div>';return}if(!state?.started){title.textContent='قبل البداية';hint.textContent=isHost()?'اضغط ابدأ اللعبة بعد دخول اللاعبين.':'بانتظار الهوست يبدأ اللعبة.';return}if(state.winnerTeam){title.textContent='انتهت اللعبة';hint.textContent=state.winnerTeam==='mafia'?'فازت المافيا':'فاز الأبرياء';box.innerHTML='<a class="btn" href="/lobby.html?room='+encodeURIComponent(roomCode)+'">رجوع للوبي</a>';return}if(state.phase==='role'){title.textContent='كشف الدور';hint.textContent='احفظ دورك ثم اضغط التالي.';box.innerHTML='<button class="btn secondary" '+(!isHost()?'disabled':'')+' onclick="next()">الانتقال لليل</button>';return}if(state.phase==='night'){title.textContent='إجراء الليل';const role=myRole||state.myRole;if(role==='mafia'){hint.textContent='اختر ضحية.';aliveTargets(false).forEach(p=>box.insertAdjacentHTML('beforeend',`<button class="target" onclick="night('kill','${p.clientId}')">قتل<br><b>${esc(p.name)}</b></button>`))}else if(role==='doctor'){hint.textContent='اختر لاعبًا لحمايته.';aliveTargets(true).forEach(p=>box.insertAdjacentHTML('beforeend',`<button class="target" onclick="night('save','${p.clientId}')">حماية<br><b>${esc(p.name)}</b></button>`))}else if(role==='detective'){hint.textContent='اختر لاعبًا للتحقيق.';aliveTargets(false).forEach(p=>box.insertAdjacentHTML('beforeend',`<button class="target" onclick="night('check','${p.clientId}')">تحقيق<br><b>${esc(p.name)}</b></button>`));if(state.investigationResult){hint.textContent+=' النتيجة: '+(state.investigationResult.isMafia?'مافيا':'ليس مافيا')}}else{hint.textContent='ليس لديك إجراء ليلي.'}}else if(state.phase==='day'){title.textContent='تصويت النهار';hint.textContent='صوّت ضد اللاعب المشكوك فيه.';aliveTargets(false).forEach(p=>box.insertAdjacentHTML('beforeend',`<button class="target" onclick="vote('${p.clientId}')">تصويت ضد<br><b>${esc(p.name)}</b></button>`))}}
function renderLogs(){const logs=[];if(state?.lastResult){const r=state.lastResult;if(r.phase==='nightEnd')logs.push(r.killed?'تم قتل لاعب في الليل.':'لم يمت أحد في الليل.');if(r.phase==='dayEnd')logs.push(r.executed?'تم إعدام لاعب بالتصويت.':'انتهى التصويت بدون إعدام.');if(r.phase==='nightStart')logs.push('بدأ الليل.');}if(state?.winnerTeam)logs.push(state.winnerTeam==='mafia'?'انتصرت المافيا.':'انتصر الأبرياء.');if(!logs.length)logs.push('لا توجد أحداث بعد.');$('logs').innerHTML=logs.map(x=>`<div class="logItem">${esc(x)}</div>`).join('')}
function start(){socket.emit('mafia:start',{roomCode,clientId:cid})}function next(){socket.emit('mafia:next',{roomCode,clientId:cid})}function night(action,targetId){socket.emit('mafia:nightAction',{roomCode,clientId:cid,action,targetId});toast('تم إرسال الإجراء')}function vote(targetId){socket.emit('mafia:vote',{roomCode,clientId:cid,targetId});toast('تم التصويت')}$('startBtn').onclick=start;$('nextBtn').onclick=next;$('backLobby').onclick=()=>{if(isHost())socket.emit('lobby:reset',{roomCode,clientId:cid});else location.href='/lobby.html?room='+encodeURIComponent(roomCode);};socket.on('host:changed',({newHostClientId}={})=>{if(roomState)roomState.hostClientId=newHostClientId;render();toast('المضيف تغيّر');});render();
</script>
</body></html>
