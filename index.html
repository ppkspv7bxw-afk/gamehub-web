<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Game Hub 4U</title>
  <style>
    :root{--bg:#0b1020;--text:#eef1ff;--muted:#a7b0d6;--border:rgba(255,255,255,.10);--shadow:0 14px 40px rgba(0,0,0,.45);--red:#ff2e55;--green:#2ee59d;--btn1:#ff3b6a;--btn2:#ff1f4f;--radius:18px}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 800px at 20% 0%,#19214a 0%,var(--bg) 55%);color:var(--text);min-height:100vh}.wrap{max-width:760px;margin:0 auto;padding:22px}.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative}.statusLight{position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:999px;background:var(--red);box-shadow:0 0 0 4px rgba(255,46,85,.12),0 0 18px rgba(255,46,85,.35)}.statusLight.ok{background:var(--green);box-shadow:0 0 0 4px rgba(46,229,157,.14),0 0 18px rgba(46,229,157,.35)}.brand{display:flex;justify-content:center;margin:8px 0 14px}.brand img{width:320px;max-width:92%;height:auto;filter:drop-shadow(0 18px 34px rgba(255,35,79,.18));border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{padding:14px;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.18)}h1{font-size:22px;margin:0 0 8px}.muted{color:var(--muted);font-size:14px;line-height:1.5}.btn{width:100%;border:0;border-radius:16px;padding:14px;font-weight:950;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 12px 26px rgba(255,35,79,.22);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:none;color:var(--text)}input{width:100%;padding:14px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);color:var(--text);outline:none;font-size:16px;margin-top:10px}.toast{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:10px 12px;border-radius:14px;font-weight:900;display:none;z-index:9999;box-shadow:var(--shadow)}@media(max-width:720px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap"><div class="card"><span id="light" class="statusLight"></span><div class="brand"><img src="/brand.png" alt="Game Hub 4U"></div><div class="grid"><div class="box"><h1>Host Room</h1><p class="muted">Create a private room and share the code with your players.</p><a class="btn" href="/host.html">Host</a></div><div class="box"><h1>Join Room</h1><p class="muted">Enter the 4-character room code and your name.</p><input id="room" placeholder="Room code مثل: 6F3J" maxlength="8" autocomplete="off"><input id="name" placeholder="Your name" maxlength="24" autocomplete="name"><button id="join" class="btn secondary" style="margin-top:10px">Join</button></div></div></div></div><div id="toast" class="toast"></div>
  <script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script>
  <script>
    const SERVER_URL='https://api.gamehub4u.com';
    let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}
    const qs=new URLSearchParams(location.search); const room=document.getElementById('room'); const name=document.getElementById('name'); const light=document.getElementById('light'); const toast=document.getElementById('toast');
    room.value=(qs.get('room')||'').toUpperCase();
    const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid}});
    socket.on('connect',()=>light.classList.add('ok')); socket.on('disconnect',()=>light.classList.remove('ok'));
    function show(t){toast.textContent=t;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1400)}
    function clean(x){return String(x||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}
    function join(){const rc=clean(room.value);const nm=String(name.value||'').trim().slice(0,24);if(!rc)return show('Enter room code');if(!nm)return show('Enter name');localStorage.setItem('gh_playerName',nm);localStorage.setItem('playerName',nm);socket.emit('player:join',{roomCode:rc,name:nm,clientId:cid});}
    document.getElementById('join').onclick=join; [room,name].forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter')join()}));
    socket.on('join:error',({message}={})=>show(message||'Join error'));
    socket.on('player:joined',({roomCode}={})=>{location.href='/lobby.html?room='+encodeURIComponent(clean(roomCode||room.value));});
  </script>
</body>
</html>
