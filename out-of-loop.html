<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Out of the Loop</title>
<style>body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#2b175c,#090b16 58%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.35);margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.light{width:13px;height:13px;border-radius:999px;background:#ff3860;display:inline-block;box-shadow:0 0 18px #ff3860}.light.ok{background:#2ee59d;box-shadow:0 0 18px #2ee59d}.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.06);color:#cbd1ef;font-size:13px}.title{font-size:42px;font-weight:1000;letter-spacing:-1px;margin:10px 0;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;color:transparent}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.player,.option{border:1px solid rgba(255,255,255,.1);background:rgba(0,0,0,.18);border-radius:18px;padding:13px}.btn{border:0;border-radius:16px;padding:12px 15px;font-weight:950;cursor:pointer;color:white;background:linear-gradient(135deg,#8b5cf6,#ec4899);box-shadow:0 12px 26px rgba(236,72,153,.22)}.btn.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.small{color:#aab0d1;font-size:13px;line-height:1.6}.word{font-size:34px;font-weight:1000;text-align:center;padding:26px;border-radius:22px;background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.25);margin:14px 0}.danger{color:#fb7185}.success{color:#34d399}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.toast{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:10px 12px;display:none;font-weight:900}</style></head><body><div class="wrap"><div class="card"><div class="top"><span class="pill"><span id="light" class="light"></span> Socket</span><span class="pill">Room: <b id="room">----</b></span><button class="btn secondary" onclick="goLobby()">Lobby</button></div><h1 class="title">برا السالفة</h1><p class="small">كل اللاعبين يعرفون كلمة واحدة، إلا لاعب واحد برا السالفة. حاولوا تكتشفونه من الأسئلة.</p></div><div id="app"></div></div><div id="toast" class="toast"></div>
<script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script><script>
const SERVER_URL='https://api.gamehub4u.com';const qs=new URLSearchParams(location.search);const roomCode=(qs.get('room')||'').toUpperCase();let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}const name=localStorage.getItem('gh_name')||localStorage.getItem('playerName')||'Player';const $=id=>document.getElementById(id);let state=null;let loadError='';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',1600)}
const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid,gh_clientId:cid}});socket.on('connect',()=>{$('light').classList.add('ok');socket.emit('player:attach',{roomCode,clientId:cid});socket.emit('outloop:getState',{roomCode,clientId:cid});});socket.on('disconnect',()=>$('light').classList.remove('ok'));socket.on('outloop:state',s=>{state=s;loadError='';render()});socket.on('outloop:timer',({timeLeft})=>{if(state){state.timeLeft=timeLeft;render()}});socket.on('game:error',({message}={})=>{loadError=message||'Error';show(loadError);render()});socket.on('lobby:reset',()=>{location.href='/lobby.html?room='+roomCode;});socket.on('host:changed',({newHostClientId}={})=>{if(state)state.isHost=(newHostClientId===cid);render();});$('room').textContent=roomCode;
setTimeout(()=>{if(!state){loadError='ما وصل رد من السيرفر. ارفع gamehub-server الجديد على Render واعمل Manual Deploy ثم جرّب مرة ثانية.';render()}},3500);
function render(){if(!state){$('app').innerHTML='<div class="card">'+(loadError?('<b>مشكلة اتصال</b><p class="small">'+esc(loadError)+'</p>'):'Loading...')+'</div>';return}let html='';const isHost=!!state.isHost;if(state.phase==='lobby'){html+=`<div class="card"><h2>الإعدادات</h2><p class="small">اختر التصنيف ثم ابدأ اللعبة. تحتاج 3 لاعبين على الأقل.</p><div class="grid">${state.categories.map(c=>`<button class="option" onclick="setCat('${c.id}')" style="color:white;text-align:right;cursor:pointer;border-color:${state.categoryId===c.id?'#c084fc':'rgba(255,255,255,.1)'}"><b>${esc(c.name)}</b></button>`).join('')}</div><div class="row" style="margin-top:12px"><button class="btn" ${!isHost?'disabled':''} onclick="start()">Start Out of the Loop</button></div></div>`}if(state.phase==='reveal'){const meTurn=state.revealPlayerId===cid;html+=`<div class="card"><h2>كشف الكلمة</h2><p class="small">مرر الجهاز/الشاشة على اللاعب المطلوب بدون ما يشوفون الباقين.</p><div class="word">${meTurn&&state.myWord?esc(state.myWord):'الدور على لاعب آخر'}</div><p class="small">اللاعب الحالي: <b>${esc((state.players.find(p=>p.clientId===state.revealPlayerId)||{}).name||'—')}</b></p><button class="btn" onclick="nextReveal()">التالي</button></div>`}if(state.phase==='playing'){html+=`<div class="card"><h2>وقت الأسئلة</h2><div class="word">${fmt(state.timeLeft)}</div><p class="small">اسألوا بعض أسئلة ذكية بدون ما تكشفون الكلمة بوضوح.</p><button class="btn" ${!isHost?'disabled':''} onclick="voteStart()">ابدأ التصويت</button></div>`}if(state.phase==='voting'){html+=`<div class="card"><h2>من برا السالفة؟</h2><div class="grid">${state.players.map(p=>`<button class="option" onclick="vote('${p.clientId}')"><b>${esc(p.name)}</b></button>`).join('')}</div><p class="small">الأصوات: ${Object.keys(state.votes||{}).length}</p></div>`}if(state.phase==='result'){const r=state.result||{};html+=`<div class="card"><h2>النتيجة</h2><div class="word ${r.caught?'success':'danger'}">${r.caught?'تم كشف برا السالفة':'برا السالفة فاز'}</div><p>برا السالفة: <b>${esc(r.outsiderName)}</b></p><p>الكلمة: <b>${esc(r.word)}</b></p><div class="row"><button class="btn" ${!isHost?'disabled':''} onclick="reset()">رجوع للوبي</button><button class="btn secondary" onclick="goLobby()">Lobby</button></div></div>`}html+=`<div class="card"><h3>اللاعبين</h3><div class="grid">${state.players.map(p=>`<div class="player"><b>${esc(p.name)}</b><div class="small">${p.clientId===cid?'أنت':''} ${p.isBot?'Bot':''}</div></div>`).join('')}</div></div>`;$('app').innerHTML=html}
function fmt(s){s=Number(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}function setCat(id){socket.emit('outloop:setCategory',{roomCode,clientId:cid,categoryId:id})}function start(){socket.emit('outloop:start',{roomCode,clientId:cid})}function nextReveal(){socket.emit('outloop:nextReveal',{roomCode,clientId:cid})}function voteStart(){socket.emit('outloop:voteStart',{roomCode,clientId:cid})}function vote(id){socket.emit('outloop:vote',{roomCode,clientId:cid,targetId:id})}function reset(){if(state&&state.isHost)socket.emit('outloop:reset',{roomCode,clientId:cid});}function goLobby(){if(state&&state.isHost)socket.emit('outloop:reset',{roomCode,clientId:cid});else location.href='/lobby.html?room='+roomCode;}
render();</script></body></html>
