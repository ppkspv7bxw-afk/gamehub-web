<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Host</title>
  <style>
    :root{--bg:#0b1020;--text:#eef1ff;--muted:#a7b0d6;--border:rgba(255,255,255,.10);--shadow:0 14px 40px rgba(0,0,0,.45);--red:#ff2e55;--green:#2ee59d;--btn1:#ff3b6a;--btn2:#ff1f4f;--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 800px at 20% 0%,#19214a 0%,var(--bg) 55%);color:var(--text)}.wrap{max-width:980px;margin:0 auto;padding:22px}.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative}.statusLight{position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:999px;background:var(--red);box-shadow:0 0 0 4px rgba(255,46,85,.12),0 0 18px rgba(255,46,85,.35)}.statusLight.ok{background:var(--green);box-shadow:0 0 0 4px rgba(46,229,157,.14),0 0 18px rgba(46,229,157,.35)}.brand{display:flex;justify-content:center;margin:6px 0 12px}.brand img{width:360px;max-width:92%;height:auto;filter:drop-shadow(0 18px 34px rgba(255,35,79,.18));border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:13px;color:var(--muted)}.roomCode{font-weight:950;letter-spacing:5px;color:#fff;font-size:22px}.btn{border:0;border-radius:16px;padding:14px 14px;font-weight:950;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 12px 26px rgba(255,35,79,.22);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.secondary,.tab{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:none;color:var(--text)}.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.tab{border-radius:14px;padding:10px 12px;font-weight:950;cursor:pointer}.tab.active{background:rgba(255,35,79,.16);border-color:rgba(255,35,79,.28)}.grid{margin-top:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.player{padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:10px;overflow:hidden}.name{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-weight:950;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:rgba(167,176,214,.95);white-space:nowrap}.badge.ready{border-color:rgba(46,229,157,.25);color:rgba(46,229,157,.95);background:rgba(46,229,157,.10)}.hostAsPlayerBox{margin-top:12px;display:none;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}input{width:min(360px,100%);padding:13px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.22);color:var(--text);outline:none;font-size:16px}.qrWrap{margin-top:14px;display:flex;justify-content:center}.qrCard{width:380px;max-width:100%;border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.03);padding:14px;text-align:center}.qrWhite{background:#fff;border-radius:16px;padding:14px;display:inline-flex}.qrWhite img{width:320px;max-width:100%;height:auto;display:block}.toast{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:10px 12px;border-radius:14px;font-weight:900;display:none;z-index:9999;box-shadow:var(--shadow)}
  </style>
</head>
<body><div class="wrap"><div class="card"><span id="light" class="statusLight"></span><div class="brand"><img src="/brand.png" alt="brand"></div><div class="row"><div class="pill">Room: <span id="code" class="roomCode">----</span></div><div class="pill">Players: <strong id="count">0</strong></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button id="copyLink" class="btn secondary" disabled>Copy invite</button><button id="start" class="btn" disabled>Start → Lobby</button></div></div><div class="tabs"><button id="modeDisplay" class="tab active">Display</button><button id="modePlayer" class="tab">Host & Player</button></div><div id="hostAsPlayerBox" class="hostAsPlayerBox"><input id="myName" placeholder="Host player name" maxlength="24"><button id="joinAsPlayer" class="btn secondary" disabled>Join as Player</button><button id="readyMe" class="btn secondary" disabled>Ready</button><button id="leaveMe" class="btn secondary" disabled>Leave</button></div><div class="qrWrap"><div class="qrCard"><div class="qrWhite"><img id="qrImg" alt="QR"></div></div></div><div id="players" class="grid"></div></div></div><div id="toast" class="toast"></div>
<script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script>
<script>
const SERVER_URL='https://api.gamehub4u.com', SITE_ORIGIN=location.origin;let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}
const $=id=>document.getElementById(id), light=$('light'), count=$('count'), start=$('start'), codeEl=$('code'), playersEl=$('players'), copy=$('copyLink'), toast=$('toast'), qrImg=$('qrImg'), box=$('hostAsPlayerBox'), modeDisplay=$('modeDisplay'), modePlayer=$('modePlayer'), myName=$('myName'), joinAs=$('joinAsPlayer'), readyBtn=$('readyMe'), leaveBtn=$('leaveMe');
const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid}});let roomCode='', hostMode=localStorage.getItem('hostMode')||'display', joined=true, myReady=false, currentPlayers=[];
function clean(x){return String(x||'').trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8)}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function link(){return SITE_ORIGIN+'/?room='+encodeURIComponent(roomCode)}function show(t){toast.textContent=t;toast.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>toast.style.display='none',1400)}
function setMode(m){hostMode=m;localStorage.setItem('hostMode',m);modeDisplay.classList.toggle('active',m==='display');modePlayer.classList.toggle('active',m==='player');box.style.display=m==='player'?'flex':'none';joinAs.disabled=!roomCode;readyBtn.disabled=m!=='player'||!roomCode;leaveBtn.disabled=m!=='player'||!roomCode}
function render(players=[]){currentPlayers=players;count.textContent=players.length;playersEl.innerHTML='';players.forEach(p=>{const r=!!(p.isReady||p.ready);const d=document.createElement('div');d.className='player';d.innerHTML=`<div class="name">${esc(p.name)}${p.isHost?' 👑':''}${p.connected===false?' · offline':''}</div><div class="badge ${r?'ready':''}">${r?'READY':'WAIT'}</div>`;playersEl.appendChild(d)});const all=players.length>0&&players.every(p=>!!(p.isReady||p.ready));start.disabled=!roomCode||!all;}
function update(payload={}){roomCode=clean(payload.roomCode||payload.code||roomCode);if(roomCode){codeEl.textContent=roomCode;copy.disabled=false;joinAs.disabled=false;qrImg.src=SERVER_URL+'/qr?data='+encodeURIComponent(link())+'&t='+Date.now()}render(payload.players||currentPlayers)}
modeDisplay.onclick=()=>setMode('display');modePlayer.onclick=()=>setMode('player');setMode(hostMode);
socket.on('connect',()=>{light.classList.add('ok');socket.emit('host:createRoom',{clientId:cid,name:'Host'});});socket.on('disconnect',()=>{light.classList.remove('ok');start.disabled=true;copy.disabled=true});socket.on('room:created',update);socket.on('room:update',update);socket.on('players:update',update);socket.on('join:error',({message}={})=>show(message||'Join error'));socket.on('game:error',({message}={})=>show(message||'Cannot start'));socket.on('start:error',({message}={})=>show(message||'Cannot start'));
start.onclick=()=>{if(roomCode)socket.emit('game:start',{roomCode,clientId:cid})};socket.on('game:started',({roomCode:rc}={})=>{location.href='/lobby.html?room='+encodeURIComponent(clean(rc||roomCode))});copy.onclick=()=>navigator.clipboard?.writeText(link()).then(()=>show('Copied ✅')).catch(()=>show('Copy failed'));
joinAs.onclick=()=>{const nm=String(myName.value||'').trim()||'Host';socket.emit('player:join',{roomCode,name:nm,clientId:cid});joined=true;readyBtn.disabled=false;leaveBtn.disabled=false;show('Joined as Host')};readyBtn.onclick=()=>{myReady=!myReady;readyBtn.textContent=myReady?'Unready':'Ready';socket.emit('player:ready',{roomCode,isReady:myReady,clientId:cid})};leaveBtn.onclick=()=>{socket.emit('player:leave',{roomCode,clientId:cid});location.href='/'};
</script></body></html>
