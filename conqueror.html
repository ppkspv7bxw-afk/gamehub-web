<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conqueror</title>
<style>body{margin:0;min-height:100vh;background:#09090b;color:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.layout{display:grid;grid-template-columns:320px 1fr;min-height:100vh}.side{background:#18181b;border-right:1px solid #27272a;padding:20px}.main{padding:22px}.card{background:#18181b;border:1px solid #27272a;border-radius:24px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid #333;border-radius:999px;padding:8px 12px;color:#a1a1aa;font-size:13px}.light{width:12px;height:12px;border-radius:999px;background:#ef4444;box-shadow:0 0 16px #ef4444}.light.ok{background:#22c55e;box-shadow:0 0 16px #22c55e}.title{font-size:32px;font-weight:1000;letter-spacing:-1px;text-transform:uppercase;font-style:italic}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:950;cursor:pointer;background:#f4f4f5;color:#09090b}.btn.secondary{background:#27272a;color:#f4f4f5;border:1px solid #3f3f46}.btn.danger{background:#ef4444;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.territory{border:1px solid #333;border-radius:20px;padding:14px;background:#111113;cursor:pointer}.territory:hover{border-color:#71717a}.small{font-size:12px;color:#a1a1aa;line-height:1.55}.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.res div{text-align:center;background:#09090b;border:1px solid #27272a;border-radius:14px;padding:10px}.dot{width:12px;height:12px;border-radius:999px;display:inline-block}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toast{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.7);border:1px solid #333;border-radius:14px;padding:10px 12px;display:none;font-weight:900}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid #27272a}}</style></head><body><div class="layout"><aside class="side"><div class="top"><span class="pill"><span id="light" class="light"></span> Socket</span><button class="btn secondary" onclick="backToLobby()">Lobby</button></div><h1 class="title">Conqueror</h1><p class="small">Capture territories, recruit armies, and dominate the map.</p><div id="panel"></div></aside><main class="main"><div id="app"></div></main></div><div id="toast" class="toast"></div>
<script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script><script>
const SERVER_URL='https://api.gamehub4u.com';const qs=new URLSearchParams(location.search);const roomCode=(qs.get('room')||'').toUpperCase();let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}const $=id=>document.getElementById(id);let state=null;let loadError='';function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',1600)}
const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid,gh_clientId:cid}});socket.on('connect',()=>{$('light').classList.add('ok');socket.emit('player:attach',{roomCode,clientId:cid});socket.emit('conqueror:getState',{roomCode,clientId:cid});});socket.on('disconnect',()=>$('light').classList.remove('ok'));socket.on('conqueror:state',s=>{state=s;loadError='';render()});socket.on('game:error',({message}={})=>{loadError=message||'Error';show(loadError);render()});socket.on('lobby:reset',()=>{location.href='/lobby.html?room='+roomCode;});socket.on('host:changed',({newHostClientId}={})=>{if(state)state.isHost=(newHostClientId===cid);render();});
function current(){return state?.players?.[cid]}function owned(pid){return Object.values(state?.territories||{}).filter(t=>t.ownerId===pid)}function ownerName(id){return id&&state.players[id]?state.players[id].name:'Neutral'}function color(id){return id&&state.players[id]?state.players[id].color:'#3f3f46'}function isNeighbor(t){return Object.values(state.territories||{}).some(x=>x.ownerId===cid&&x.neighbors.includes(t.id))}
function renderPanel(){if(!state){$('panel').innerHTML='';return}const me=current();if(!me){$('panel').innerHTML='<div class="card"><p class="small">You are not in this room.</p></div>';return}$('panel').innerHTML=`<div class="card"><div class="row"><span class="dot" style="background:${me.color}"></span><b>${esc(me.name)}</b></div><p class="small">Room: ${roomCode}</p><div class="res"><div><b>${me.resources.gold}</b><br><span class="small">Gold</span></div><div><b>${me.resources.wood}</b><br><span class="small">Wood</span></div><div><b>${me.resources.iron}</b><br><span class="small">Iron</span></div></div><p>Reserve Armies: <b>${me.armies}</b></p><div class="row"><button class="btn secondary" onclick="recruit(1)">+1 Army</button><button class="btn secondary" onclick="recruit(5)">+5 Armies</button></div></div><div class="card"><h3>Leaderboard</h3>${Object.values(state.players).sort((a,b)=>owned(b.id).length-owned(a.id).length).map(p=>`<div class="row" style="justify-content:space-between;margin:8px 0"><span><span class="dot" style="background:${p.color}"></span> ${esc(p.name)}</span><b>${owned(p.id).length}</b></div>`).join('')}</div>`}
setTimeout(()=>{if(!state){loadError='ما وصل رد من السيرفر. ارفع gamehub-server الجديد على Render واعمل Manual Deploy ثم جرّب مرة ثانية.';render()}},3500);
function render(){renderPanel();if(!state){$('app').innerHTML='<div class="card">'+(loadError?('<b>Connection problem</b><p class="small">'+esc(loadError)+'</p>'):'Loading...')+'</div>';return}if(state.status==='lobby'){ $('app').innerHTML=`<div class="card"><div class="top"><div><h2>War Lobby</h2><p class="small">Waiting for host to start the conquest.</p></div><span class="pill">Room: <b>${roomCode}</b></span></div><div class="grid">${Object.values(state.players).map(p=>`<div class="territory"><div class="row"><span class="dot" style="background:${p.color}"></span><b>${esc(p.name)}</b></div></div>`).join('')}</div><br><button class="btn" ${!state.isHost?'disabled':''} onclick="start()">Start Conquest</button></div>`; return }if(state.status==='ended'){const w=state.players[state.winnerId];$('app').innerHTML=`<div class="card"><h2>Conquest Ended</h2><h1>${w?esc(w.name):'Unknown'} Wins</h1><button class="btn" onclick="backToLobby()">Back to Lobby</button></div>`;return}const territories=Object.values(state.territories);$('app').innerHTML=`<div class="card top"><div><h2>Strategic Map</h2><p class="small">Click your territory to reinforce. Click neutral/enemy adjacent territory to capture/attack.</p></div><button class="btn danger" ${!state.isHost?'disabled':''} onclick="finish()">Finish & Score</button></div><div class="grid">${territories.map(t=>`<div class="territory" onclick="capture('${t.id}')" style="border-color:${t.ownerId?color(t.ownerId):(isNeighbor(t)?'#f4f4f5':'#333')}"><div class="top"><b>${esc(t.name)}</b><span class="pill">${esc(t.type)}</span></div><p class="small">Owner: <span style="color:${color(t.ownerId)}">${esc(ownerName(t.ownerId))}</span></p><p>Armies on land: <b>${t.armies}</b></p><p class="small">Neighbors: ${t.neighbors.join(', ')}</p></div>`).join('')}</div><div class="card"><h3>Rules</h3><p class="small">Neutral land costs 1 reserve army. Attacking requires adjacency and more reserve armies than the defender. Resources generate every 5 seconds.</p></div>`}
function start(){socket.emit('conqueror:start',{roomCode,clientId:cid})}function recruit(count){socket.emit('conqueror:recruit',{roomCode,clientId:cid,count})}function capture(id){socket.emit('conqueror:capture',{roomCode,clientId:cid,territoryId:id})}function finish(){socket.emit('conqueror:finish',{roomCode,clientId:cid})}function backToLobby(){if(state&&state.isHost)socket.emit('conqueror:reset',{roomCode,clientId:cid});else location.href='/lobby.html?room='+roomCode;}
render();</script></body></html>
