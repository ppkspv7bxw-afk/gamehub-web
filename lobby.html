<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Hub 4U - Lobby</title>
<style>
:root{--bg:#0b1020;--text:#eef1ff;--muted:#a7b0d6;--border:rgba(255,255,255,.10);--shadow:0 14px 40px rgba(0,0,0,.45);--red:#ff2e55;--green:#2ee59d;--btn1:#ff3b6a;--btn2:#ff1f4f;--radius:18px}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 800px at 20% 0%,#19214a 0%,var(--bg) 55%);color:var(--text);min-height:100vh}.wrap{max-width:1100px;margin:0 auto;padding:22px}.card{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.03));border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}.statusLight{position:absolute;top:14px;left:14px;width:14px;height:14px;border-radius:999px;background:var(--red);box-shadow:0 0 0 4px rgba(255,46,85,.12),0 0 18px rgba(255,46,85,.35)}.statusLight.ok{background:var(--green);box-shadow:0 0 0 4px rgba(46,229,157,.14),0 0 18px rgba(46,229,157,.35)}.brand{display:flex;justify-content:center;margin:6px 0 12px}.brand img{width:260px;max-width:90%;height:auto;filter:drop-shadow(0 18px 34px rgba(255,35,79,.18));border-radius:18px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.25)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);font-size:13px;color:var(--muted)}.roomCode{font-weight:950;letter-spacing:4px;color:#fff}.tabs{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.tab{padding:10px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.18);color:var(--text);font-weight:950;cursor:pointer;opacity:.85}.tab.active{opacity:1;border-color:rgba(255,59,106,.35);background:rgba(255,59,106,.10)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;margin-top:12px}.box{border-radius:18px;border:1px solid rgba(255,255,255,.10);background:rgba(0,0,0,.18);padding:14px}.title{font-weight:1000;margin-bottom:10px}.small{font-size:12px;color:var(--muted);line-height:1.5}.player,.gameCard,.scoreCard{padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.name{font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{font-weight:950;font-size:12px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.06);color:rgba(167,176,214,.95);white-space:nowrap}.badge.ready{border-color:rgba(46,229,157,.25);color:rgba(46,229,157,.95);background:rgba(46,229,157,.10)}.btnRow{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:16px;padding:12px 14px;font-weight:950;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--btn1),var(--btn2));box-shadow:0 12px 26px rgba(255,35,79,.22);display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}.btn.secondary{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);box-shadow:none;color:var(--text)}.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none}.section{display:none}.section.active{display:block}.devBadge{display:none;margin-left:8px;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);font-weight:1000;color:rgba(255,210,218,.95)}.devBadge.on{display:inline-flex}.toast{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.12);color:var(--text);padding:10px 12px;border-radius:14px;font-weight:900;display:none;z-index:9999;box-shadow:var(--shadow)}
</style></head><body><div class="wrap"><div class="card"><span id="light" class="statusLight"></span><div class="brand"><img src="/brand.png" alt="brand"></div><div class="row"><div class="pill">Room: <span id="roomCode" class="roomCode">----</span><span id="devBadge" class="devBadge">DEV</span></div><div class="pill">Players: <strong id="pCount">0</strong></div><div class="pill">You: <strong id="meName">—</strong></div></div><div class="tabs"><button class="tab active" data-tab="players">Players</button><button class="tab" data-tab="games">Games</button><button class="tab" data-tab="score">Scoreboard</button></div><div id="playersSec" class="section active"><div class="box"><div class="title">Players</div><div id="players"></div><div class="btnRow"><button id="readyBtn" class="btn">Ready</button><button id="leaveBtn" class="btn secondary">Leave</button></div></div></div><div id="gamesSec" class="section"><div class="box"><div class="title">Choose Game</div><div id="games" class="grid"></div><div class="btnRow"><button id="devBtn" class="btn secondary">Toggle Dev Mode</button></div><p class="small">Normal mode: Mafia تحتاج لاعبين، Out of the Loop تحتاج 3، Conqueror تحتاج لاعبين. Dev Mode يسمح بالتجربة الفردية.</p></div></div><div id="scoreSec" class="section"><div class="box"><div class="title">Scoreboard</div><div id="scores"></div></div></div></div></div><div id="toast" class="toast"></div>
<script src="https://api.gamehub4u.com/socket.io/socket.io.js"></script>
<script>
const SERVER_URL='https://api.gamehub4u.com';let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}
const qs=new URLSearchParams(location.search);const roomCode=(qs.get('room')||qs.get('code')||'').toUpperCase();const name=localStorage.getItem('gh_playerName')||localStorage.getItem('playerName')||'Player';const $=id=>document.getElementById(id);let myReady=false,dev=false,state=null;
const games=[{id:'mafia',name:'Mafia',desc:'المافيا الجديدة مع أدوار وبوتات وتجربة كاملة.',path:'/mafia.html'},{id:'out-of-loop',name:'Out of the Loop',desc:'واحد برا السالفة والباقي يعرفون الكلمة.',path:'/out-of-loop.html'},{id:'conqueror',name:'Conqueror',desc:'خريطة مناطق، موارد، جيوش، وسيطرة.',path:'/conqueror.html'}];
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',1600)}
const socket=io(SERVER_URL,{transports:['websocket','polling'],auth:{clientId:cid,gh_clientId:cid}});
function render(s){if(!s)return;state=s;dev=!!s.devMode;$('roomCode').textContent=s.roomCode||s.code||roomCode;$('pCount').textContent=s.players?.length||0;$('devBadge').classList.toggle('on',dev);const me=(s.players||[]).find(p=>p.clientId===cid||p.socketId===socket.id);$('meName').textContent=me?.name||name;myReady=!!(me?.isReady||me?.ready);$('readyBtn').textContent=myReady?'Unready':'Ready';$('players').innerHTML=(s.players||[]).map(p=>`<div class="player"><div><div class="name">${esc(p.name)} ${p.clientId===cid?'(You)':''}</div><div class="small">${p.isHost?'Host':'Player'} • ${p.connected===false?'Disconnected':'Online'}</div></div><span class="badge ${p.isReady||p.ready?'ready':''}">${p.isReady||p.ready?'READY':'WAIT'}</span></div>`).join('')||'<p class="small">No players.</p>';$('scores').innerHTML=[...(s.players||[])].sort((a,b)=>(b.score||0)-(a.score||0)).map((p,i)=>`<div class="scoreCard"><div><div class="name">#${i+1} ${esc(p.name)}</div><div class="small">${p.isHost?'Host':'Player'}</div></div><span class="badge ready">${p.score||0} pts</span></div>`).join('');renderGames(s)}
function renderGames(s){const selected=s.selectedGame||s.currentGame||'mafia';$('games').innerHTML=games.map(g=>`<div class="gameCard"><div><div class="name">${g.name}</div><div class="small">${g.desc}</div></div><div class="btnRow"><button class="btn secondary" onclick="selectGame('${g.id}')">${selected===g.id?'Selected':'Select'}</button><button class="btn" onclick="startGame('${g.id}')">Start</button></div></div>`).join('')}
window.selectGame=(gameId)=>socket.emit('room:setGame',{roomCode,clientId:cid,gameId});window.startGame=(gameId)=>socket.emit('game:start',{roomCode,clientId:cid,gameId});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['players','games','score'].forEach(t=>$(t+'Sec').classList.toggle('active',b.dataset.tab===t));});
socket.on('connect',()=>{ $('light').classList.add('ok'); if(roomCode){socket.emit('player:attach',{roomCode,clientId:cid,name});socket.emit('room:getState',{roomCode});socket.emit('hub:getState',{roomCode});}});socket.on('disconnect',()=>$('light').classList.remove('ok'));socket.on('room:update',render);socket.on('room:state',render);socket.on('players:update',render);socket.on('join:error',({message}={})=>show(message||'Join error'));socket.on('room:error',({message}={})=>show(message||'Room error'));socket.on('game:error',({message}={})=>show(message||'Cannot start'));socket.on('game:started',({roomCode:rc,gameId}={})=>{const g=games.find(x=>x.id===(gameId||'mafia'))||games[0];location.href=g.path+'?room='+encodeURIComponent(rc||roomCode);});socket.on('player:joined',()=>socket.emit('room:getState',{roomCode}));socket.on('lobby:reset',({roomCode:rc}={})=>{location.href='/lobby.html?room='+encodeURIComponent(rc||roomCode)});socket.on('host:changed',({newHostClientId,newHostName}={})=>{if(state){state.hostClientId=newHostClientId;render(state);}show((newHostName||'لاعب')+' أصبح المضيف الجديد');});
$('readyBtn').onclick=()=>{socket.emit('player:ready',{roomCode,clientId:cid,isReady:!myReady})};$('leaveBtn').onclick=()=>{socket.emit('player:leave',{roomCode,clientId:cid});location.href='/'};$('devBtn').onclick=()=>socket.emit('host:setDevMode',{roomCode,clientId:cid,enabled:!dev});
if(!roomCode){show('Missing room code');}
</script></body></html>
