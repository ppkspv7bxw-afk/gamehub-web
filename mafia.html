<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لعبة مافيا</title>
  <style>
    :root{--bg:#070812;--card:rgba(255,255,255,.065);--card2:rgba(0,0,0,.22);--line:rgba(255,255,255,.11);--text:#fff7ed;--muted:rgba(255,237,213,.62);--orange:#f97316;--red:#ef4444;--green:#22c55e;--blue:#3b82f6;--purple:#a855f7;--amber:#f59e0b;--shadow:0 24px 70px rgba(0,0,0,.45);--r:28px}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(900px 700px at 80% -10%,rgba(249,115,22,.18),transparent 60%),radial-gradient(1000px 700px at 0% 30%,rgba(127,29,29,.20),transparent 60%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Tahoma,Arial,sans-serif}.atmosphere{position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 90%)}.wrap{position:relative;max-width:1280px;margin:auto;padding:18px}.glass{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.035));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(16px);border-radius:var(--r)}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px;margin-bottom:16px}.brand{display:flex;align-items:center;gap:12px}.logo{width:58px;height:58px;border-radius:999px;display:grid;place-items:center;background:rgba(249,115,22,.14);border:1px solid rgba(249,115,22,.35);box-shadow:0 0 28px rgba(249,115,22,.18);font-size:28px}.title{font-size:24px;font-weight:1000;line-height:1.1}.sub{font-size:12px;color:var(--muted);margin-top:4px}.phase{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-size:12px;font-weight:900;color:var(--muted)}.pill strong{color:#fff}.status{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(239,68,68,.13),0 0 18px rgba(239,68,68,.35)}.status.ok{background:var(--green);box-shadow:0 0 0 4px rgba(34,197,94,.13),0 0 18px rgba(34,197,94,.35)}.join{min-height:100vh;display:grid;place-items:center;padding:20px}.joinCard{width:min(460px,100%);padding:28px;text-align:center}.joinCard .logo{margin:auto;width:82px;height:82px;font-size:42px}.joinCard h1{font-size:38px;margin:18px 0 8px}.field{text-align:right;margin-top:14px}.field label{display:block;font-size:11px;color:var(--orange);font-weight:1000;letter-spacing:.08em;margin-bottom:8px}input,select{width:100%;padding:13px 14px;border-radius:16px;border:1px solid var(--line);background:rgba(0,0,0,.32);color:#fff;outline:none;font-size:16px}input:focus,select:focus{border-color:rgba(249,115,22,.6)}.btn{border:0;border-radius:999px;padding:12px 16px;font-weight:1000;cursor:pointer;color:#fff;background:#ea580c;box-shadow:0 14px 30px rgba(234,88,12,.23);display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none}.btn:hover{background:#f97316}.btn.secondary{background:rgba(255,255,255,.075);border:1px solid var(--line);box-shadow:none}.btn:disabled{opacity:.5;cursor:not-allowed}.main{display:grid;grid-template-columns:1.4fr .85fr;gap:16px}.panel{padding:16px}.sectionTitle{font-size:16px;font-weight:1000;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px}.player{padding:12px;border-radius:20px;background:rgba(255,255,255,.055);border:1px solid var(--line);min-height:82px}.player.dead{opacity:.48;filter:grayscale(.6)}.pname{font-weight:1000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role{font-size:11px;margin-top:8px;display:inline-flex;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--line);color:var(--muted);font-weight:900}.role.MAFIA{color:#fecaca;background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.25)}.role.DOCTOR{color:#bbf7d0;background:rgba(34,197,94,.11);border-color:rgba(34,197,94,.25)}.role.DETECTIVE{color:#bfdbfe;background:rgba(59,130,246,.11);border-color:rgba(59,130,246,.25)}.role.JESTER{color:#e9d5ff;background:rgba(168,85,247,.12);border-color:rgba(168,85,247,.25)}.role.BODYGUARD{color:#fde68a;background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.25)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}.target{padding:12px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid var(--line);cursor:pointer;color:#fff;text-align:right}.target:hover,.target.pending{border-color:rgba(249,115,22,.65);background:rgba(249,115,22,.1)}.log{height:220px;overflow:auto;display:flex;flex-direction:column;gap:8px}.logItem{padding:10px 12px;border-radius:16px;background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:13px;color:rgba(255,255,255,.8)}.logItem.win{background:rgba(245,158,11,.12);border-color:rgba(245,158,11,.25);color:#fde68a}.chat{display:flex;flex-direction:column;height:320px}.chatMsgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}.msg{padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.055);border:1px solid var(--line);font-size:13px}.msg b{color:#fed7aa}.settings{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.settings.on{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.toast{position:fixed;left:16px;bottom:16px;z-index:1000;display:none;padding:10px 14px;border-radius:16px;background:rgba(0,0,0,.72);border:1px solid var(--line);font-weight:900}.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.74);z-index:999}.modal.on{display:flex}.modalBox{width:min(850px,100%);max-height:82vh;overflow:auto;padding:18px}.small{font-size:12px;color:var(--muted);line-height:1.5}.narrator{padding:12px 14px;border-radius:18px;border:1px solid rgba(249,115,22,.25);background:rgba(249,115,22,.09);color:#fed7aa;margin-bottom:12px;font-weight:800}@media(max-width:900px){.main{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.phase{width:100%}.pill{flex:1;text-align:center}.title{font-size:20px}}
  </style>
</head>
<body>
<div class="atmosphere"></div>
<div id="joinScreen" class="join">
  <div class="joinCard glass">
    <div class="logo">☠️</div>
    <h1>لعبة مافيا</h1>
    <p class="small">نسخة مافيا الجديدة: أدوار، بوتات، شات، مؤقت، وسجل مباريات.</p>
    <div class="field"><label>اسم اللاعب</label><input id="playerName" placeholder="أدخل اسمك" maxlength="24"></div>
    <div class="field"><label>رقم الغرفة</label><input id="roomId" placeholder="مثال: 6F3J" maxlength="8"></div>
    <button id="joinBtn" class="btn" style="width:100%;margin-top:18px">دخول الغرفة</button>
    <a class="btn secondary" href="/lobby.html" style="width:100%;margin-top:10px">رجوع للوبي</a>
  </div>
</div>
<div id="gameScreen" class="wrap" style="display:none">
  <header class="top glass">
    <div class="brand"><div id="phaseIcon" class="logo">☠️</div><div><div id="phaseTitle" class="title">في انتظار اللاعبين</div><div class="sub">غرفة: <b id="roomLabel">----</b> · دورك: <b id="roleLabel">غير محدد</b></div></div></div>
    <div class="phase"><span id="conn" class="status"></span><span class="pill">الوقت: <strong id="timer">—</strong></span><span class="pill">اللاعبون: <strong id="playerCount">0</strong></span><button id="historyBtn" class="btn secondary">السجل</button><a id="backLobby" class="btn secondary" href="/lobby.html">اللوبي</a></div>
  </header>
  <div class="main">
    <section class="panel glass">
      <div id="narrator" class="narrator">مرحباً بك في مدينة المافيا...</div>
      <div class="sectionTitle"><span>اللاعبون</span><div class="row"><button id="rolesBtn" class="btn secondary">الأدوار</button><button id="settingsBtn" class="btn secondary">الإعدادات</button><button id="addBotBtn" class="btn secondary">إضافة بوت</button><button id="startBtn" class="btn">ابدأ اللعبة</button></div></div>
      <div id="settings" class="settings">
        <div class="field"><label>توازن تلقائي</label><select id="autoBalance"><option value="true">مفعل</option><option value="false">يدوي</option></select></div>
        <div class="field"><label>مدة المرحلة بالثواني</label><input id="phaseDuration" type="number" min="20" max="300" value="60"></div>
        <div class="field"><label>مافيا</label><input id="mafiaCount" type="number" min="1" max="6" value="1"></div>
        <div class="field"><label>أطباء</label><input id="doctorCount" type="number" min="0" max="3" value="1"></div>
        <div class="field"><label>محققون</label><input id="detectiveCount" type="number" min="0" max="3" value="1"></div>
        <div class="field"><label>مهرج</label><input id="jesterCount" type="number" min="0" max="2" value="0"></div>
        <div class="field"><label>حارس</label><input id="bodyguardCount" type="number" min="0" max="2" value="0"></div>
      </div>
      <div id="players" class="players"></div>
      <div style="height:16px"></div>
      <div class="sectionTitle"><span id="actionTitle">الإجراء</span><span id="actionHint" class="small"></span></div>
      <div id="actions" class="actions"></div>
    </section>
    <aside class="panel glass">
      <div class="sectionTitle"><span>الأحداث</span></div><div id="logs" class="log"></div>
      <div style="height:14px"></div>
      <div class="sectionTitle"><span>الشات</span></div>
      <form id="chatForm" class="chat"><div id="chatMsgs" class="chatMsgs"></div><div class="row"><input id="chatInput" placeholder="اكتب رسالة..." maxlength="240" style="flex:1"><button class="btn" type="submit">إرسال</button></div></form>
    </aside>
  </div>
</div>
<div id="modal" class="modal"><div class="modalBox glass"><div class="sectionTitle"><span id="modalTitle">الأدوار</span><button id="closeModal" class="btn secondary">إغلاق</button></div><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const API_HTTP = location.hostname.includes('localhost') ? 'http://localhost:3000' : 'https://api.gamehub4u.com';
const API_WS = API_HTTP.replace(/^https:/,'wss:').replace(/^http:/,'ws:') + '/mafia-ws';
const qs=new URLSearchParams(location.search);const $=id=>document.getElementById(id);
let cid=localStorage.getItem('gh_clientId')||localStorage.getItem('clientId');if(!cid){cid=crypto?.randomUUID?.()||('cid_'+Math.random().toString(36).slice(2));localStorage.setItem('gh_clientId',cid);localStorage.setItem('clientId',cid)}
let ws=null,state=null,myRole=null,pendingVote=null,playerName='',roomId='';
$('roomId').value=(qs.get('room')||'').toUpperCase();$('playerName').value=localStorage.getItem('gh_playerName')||localStorage.getItem('playerName')||'';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){const x=$('toast');x.textContent=t;x.style.display='block';clearTimeout(x._t);x._t=setTimeout(()=>x.style.display='none',1600)}
function send(type,payload={}){if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,payload}))}function roleName(r){return ({MAFIA:'مافيا',DOCTOR:'طبيب',DETECTIVE:'محقق',VILLAGER:'مواطن',JESTER:'مهرج',BODYGUARD:'حارس شخصي'})[r]||'غير محدد'}
function phaseName(p){return ({LOBBY:'في انتظار اللاعبين',NIGHT:'وقت الليل',DAY:'وقت النهار',GAME_OVER:'انتهت اللعبة'})[p]||p}function phaseIcon(p){return p==='NIGHT'?'🌙':p==='DAY'?'☀️':p==='GAME_OVER'?'🏆':'☠️'}
function join(){playerName=$('playerName').value.trim().slice(0,24);roomId=$('roomId').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,8);if(!playerName)return toast('اكتب اسمك');if(!roomId)return toast('اكتب كود الغرفة');localStorage.setItem('gh_playerName',playerName);localStorage.setItem('playerName',playerName);$('joinScreen').style.display='none';$('gameScreen').style.display='block';$('roomLabel').textContent=roomId;$('backLobby').href='/lobby.html?room='+encodeURIComponent(roomId);connect()}
function connect(){ws=new WebSocket(API_WS);ws.onopen=()=>{ $('conn').classList.add('ok'); send('JOIN_ROOM',{roomId,playerId:cid,playerName});};ws.onclose=()=>{$('conn').classList.remove('ok');setTimeout(()=>connect(),1600)};ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='ROOM_UPDATED'){state=m.payload;render()}if(m.type==='ASSIGN_ROLE'){myRole=m.payload;$('roleLabel').textContent=roleName(myRole)}if(m.type==='NARRATOR_MESSAGE')$('narrator').textContent=m.payload||'';if(m.type==='CHAT_MESSAGE')addChat(m.payload)}}
function me(){return state?.players?.find(p=>p.id===cid)}function isHost(){return !!me()?.isHost || state?.players?.[0]?.id===cid}
function render(){if(!state)return;$('phaseTitle').textContent=phaseName(state.phase);$('phaseIcon').textContent=phaseIcon(state.phase);$('timer').textContent=(state.phase==='NIGHT'||state.phase==='DAY')?state.timeLeft:'—';$('playerCount').textContent=state.players.length;const m=me();if(m?.role){myRole=m.role;$('roleLabel').textContent=roleName(myRole)}$('settingsBtn').style.display=isHost()&&state.phase==='LOBBY'?'inline-flex':'none';$('addBotBtn').style.display=state.phase==='LOBBY'?'inline-flex':'none';$('startBtn').style.display=state.phase==='LOBBY'?'inline-flex':'none';$('startBtn').disabled=state.players.length<4;renderPlayers();renderLogs();renderActions();syncSettings()}
function renderPlayers(){$('players').innerHTML=state.players.map(p=>`<div class="player ${!p.isAlive?'dead':''}"><div class="pname">${esc(p.name)} ${p.isHost?'👑':''} ${p.id===cid?'· أنت':''} ${p.isBot?'🤖':''}</div><div class="small">${p.isAlive?'حي':'ميت 💀'}</div><span class="role ${p.role||''}">${roleName(p.role)}</span></div>`).join('')}
function renderLogs(){const logs=state.logs||[];$('logs').innerHTML=logs.length?logs.slice().reverse().map(l=>`<div class="logItem ${l.type==='win'?'win':''}">${esc(l.text)}</div>`).join(''):'<div class="small">لا توجد أحداث بعد.</div>'}
function aliveTargets(includeSelf=true){return state.players.filter(p=>p.isAlive&&(includeSelf||p.id!==cid))}
function renderActions(){const box=$('actions'),title=$('actionTitle'),hint=$('actionHint');box.innerHTML='';hint.textContent='';const m=me();if(!m){title.textContent='الإجراء';return}if(state.phase==='LOBBY'){title.textContent='قبل البداية';hint.textContent='تحتاجون 4 لاعبين على الأقل أو أضف بوتات للتجربة.';return}if(!m.isAlive&&state.phase!=='GAME_OVER'){title.textContent='أنت ميت';hint.textContent='تقدر تتابع الأحداث والشات فقط.';return}if(state.phase==='NIGHT'){title.textContent='إجراء الليل';let action='';let includeSelf=true;if(myRole==='MAFIA'){action='قتل';hint.textContent='اختر ضحية. المافيا لازم تتفق على نفس الهدف.'}else if(myRole==='DOCTOR'){action='حماية';hint.textContent='اختر لاعبًا لحمايته.'}else if(myRole==='DETECTIVE'){action='تحقيق';hint.textContent='اختر لاعبًا لكشف إن كان مافيا.'}else if(myRole==='BODYGUARD'){action='حراسة';includeSelf=false;hint.textContent='اختر لاعبًا تحرسه. لا يمكنك حراسة نفسك.'}else if(myRole==='JESTER'){hint.textContent='المهرج لا يملك إجراء ليليًا.';box.innerHTML='<button class="btn secondary" onclick="nightAction(\'none\')">تخطي</button>';return}else{hint.textContent='ليس لديك إجراء ليلي.';return}aliveTargets(includeSelf).forEach(p=>{if(p.id===cid&&myRole==='MAFIA')return;box.insertAdjacentHTML('beforeend',`<button class="target" onclick="nightAction('${p.id}')"><b>${action}</b><br>${esc(p.name)}</button>`)})}else if(state.phase==='DAY'){title.textContent='تصويت النهار';hint.textContent='اضغط مرة للتحديد ومرة ثانية للتأكيد.';aliveTargets(false).forEach(p=>box.insertAdjacentHTML('beforeend',`<button class="target ${pendingVote===p.id?'pending':''}" onclick="vote('${p.id}')">${pendingVote===p.id?'تأكيد التصويت ضد':'تصويت ضد'}<br><b>${esc(p.name)}</b></button>`))}else if(state.phase==='GAME_OVER'){title.textContent='انتهت اللعبة';hint.textContent='ارجعوا للوبي للعبة جديدة.';box.innerHTML='<a class="btn" href="/lobby.html?room='+encodeURIComponent(roomId)+'">رجوع للوبي</a>'}}
window.nightAction=(targetId)=>{send('NIGHT_ACTION',{targetId});toast('تم إرسال الإجراء')};window.vote=(targetId)=>{if(pendingVote===targetId){send('VOTE',{targetId});pendingVote=null;toast('تم التصويت')}else{pendingVote=targetId;renderActions()}}
function syncSettings(){if(!state?.settings)return;for(const k of ['phaseDuration','mafiaCount','doctorCount','detectiveCount','jesterCount','bodyguardCount'])if($(k))$(k).value=state.settings[k];$('autoBalance').value=String(!!state.settings.autoBalance)}
function updateSettings(){send('UPDATE_SETTINGS',{autoBalance:$('autoBalance').value==='true',phaseDuration:+$('phaseDuration').value||60,mafiaCount:+$('mafiaCount').value||1,doctorCount:+$('doctorCount').value||0,detectiveCount:+$('detectiveCount').value||0,jesterCount:+$('jesterCount').value||0,bodyguardCount:+$('bodyguardCount').value||0})}
$('joinBtn').onclick=join;['roomId','playerName'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')join()}));if($('roomId').value&&$('playerName').value)setTimeout(join,250);
$('startBtn').onclick=()=>send('START_GAME');$('addBotBtn').onclick=()=>send('ADD_BOT');$('settingsBtn').onclick=()=>$('settings').classList.toggle('on');['autoBalance','phaseDuration','mafiaCount','doctorCount','detectiveCount','jesterCount','bodyguardCount'].forEach(id=>$(id).addEventListener('change',updateSettings));
$('chatForm').onsubmit=e=>{e.preventDefault();const t=$('chatInput').value.trim();if(!t)return;send('CHAT',{playerName,text:t});$('chatInput').value=''};function addChat(msg){const d=document.createElement('div');d.className='msg';d.innerHTML=`<b>${esc(msg.playerName)}</b><br>${esc(msg.text)}`;$('chatMsgs').appendChild(d);$('chatMsgs').scrollTop=$('chatMsgs').scrollHeight}
$('rolesBtn').onclick=()=>{showModal('الأدوار',`<div class="players"><div class="player"><span class="role MAFIA">مافيا</span><p class="small">يعرفون بعضهم. يختارون ضحية واحدة كل ليلة.</p></div><div class="player"><span class="role DOCTOR">طبيب</span><p class="small">يحمي لاعبًا من القتل الليلي.</p></div><div class="player"><span class="role DETECTIVE">محقق</span><p class="small">يكشف إن كان اللاعب مافيا أم لا.</p></div><div class="player"><span class="role BODYGUARD">حارس</span><p class="small">يموت بدل اللاعب الذي يحرسه إذا هوجم.</p></div><div class="player"><span class="role JESTER">مهرج</span><p class="small">يفوز إذا تم إعدامه في النهار.</p></div><div class="player"><span class="role VILLAGER">مواطن</span><p class="small">يعتمد على النقاش والتصويت.</p></div></div>`)};
$('historyBtn').onclick=async()=>{try{const r=await fetch(API_HTTP+'/api/history');const h=await r.json();showModal('سجل المباريات',Array.isArray(h)&&h.length?h.map(g=>`<div class="logItem win"><b>الغرفة ${esc(g.roomId)}</b> · الفائز: ${esc(g.winner)}<br><span class="small">${new Date(g.completedAt).toLocaleString('ar-SA')}</span></div>`).join(''):'<p class="small">لا يوجد سجل بعد.</p>')}catch{toast('تعذر تحميل السجل')}};
function showModal(t,b){$('modalTitle').textContent=t;$('modalBody').innerHTML=b;$('modal').classList.add('on')}$('closeModal').onclick=()=>$('modal').classList.remove('on');$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('on')};
</script>
</body>
</html>
